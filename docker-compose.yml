services:
  xphotolabs:
    image: ghcr.io/cjng20u/xlab-photos:latest  # prebuilt image (pulled first)
    build: .                                     # fallback / `--build` builds from source
    container_name: xphotolabs
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file:
      - .env
    volumes:
      - ./data:/data
      # Optional: mount an existing photo library (append :ro for read-only)
      # - /path/to/your/photos:/photos
    # Optional: match host UID:GID for NAS folder permissions
    # user: "1000:1000"
